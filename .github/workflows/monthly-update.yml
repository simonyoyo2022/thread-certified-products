name: Monthly Auto-Update Thread Data

on:
  # 每月 28 日 15:00 UTC（= 台灣 23:00）自動執行
  schedule:
    - cron: '0 15 28 * *'
  # 也可手動觸發
  workflow_dispatch:
    inputs:
      reason:
        description: '手動觸發原因'
        required: false
        default: '手動更新資料'

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 環境 ────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 安裝 Python 依賴 ──────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. 安裝 Playwright Chromium（GitHub Actions 支援）────
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # ── 5. Phase 1：抓取所有公司產品清單（urllib，無需 Playwright）
      - name: Phase 1 - Scrape all companies & products
        run: |
          python -c "
          import logging, json, os
          logging.basicConfig(level=logging.INFO, format='%(asctime)s %(message)s')
          import scraper as sc
          sc.run_phase1_only()
          "
        env:
          PYTHONUNBUFFERED: '1'

      # ── 6. Phase 2+3：Playwright 抓取 Device Type & Sub Category
      - name: Phase 2+3 - Scrape Device Type & Sub Category
        run: python fix_dt_sc_playwright.py
        env:
          PYTHONUNBUFFERED: '1'

      # ── 7. 生成 Excel 報表 ───────────────────────────────────
      - name: Generate Excel report
        run: python generate_excel_all.py

      # ── 8. 顯示更新結果 ──────────────────────────────────────
      - name: Show results
        run: |
          python -c "
          import json
          with open('data/products.json') as f:
              d = json.load(f)
          prods = d['products']
          companies = len(set(p['company'] for p in prods))
          mapped_dt = sum(1 for p in prods if p.get('device_type','-') != '-')
          mapped_sc = sum(1 for p in prods if p.get('sub_category','-') != '-')
          print(f'✅ Products: {len(prods)} | Companies: {companies}')
          print(f'   DT mapped: {mapped_dt}/{len(prods)} | SC mapped: {mapped_sc}/{len(prods)}')
          print(f'   Last updated: {d.get(\"last_updated\",\"N/A\")}')
          "

      # ── 9. Commit 並 Push 更新後的資料 ───────────────────────
      - name: Commit updated data
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/products.json Thread_Certified_Products_All.xlsx
          # 只有有變更才 commit
          git diff --staged --quiet || git commit -m "🤖 Auto-update: $(date '+%Y-%m-%d %H:%M UTC') [skip ci]"

      - name: Push to GitHub
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
